    bio_html: |
      Desarrollador <span class="text-brand font-light">full stack</span> en Madrid que crea productos y ama el <span class="text-brand font-light">café</span>. También hago <span class="text-brand font-light">fotos</span> a todo lo que se mueve, tengo más <span class="text-brand font-light">videojuegos</span> de los que puedo jugar sin quedarme dormido.
